openapi: 3.1.0
info:
  title: SFU Engine HTTP API
  version: 0.6.0
  summary: HTTP endpoints of the Go WebRTC SFU engine.
  description: |
    The SFU has a small HTTP surface. Almost all interaction happens over the
    WebSocket signaling connection at `/ws`. Its messages are described in the
    AsyncAPI document at `/api/asyncapi.yaml` (rendered at `/docs/signaling`).

    **Server API (`/v1`).** Tenants' backends (and the server SDKs) manage
    rooms and participants and create join tokens. Every `/v1` request needs
    `Authorization: Bearer <API token>`: a JWT signed with HS256 and the
    tenant secret, with claims `iss` (API key), `aud: "sfu-api"`, `iat` and
    `exp` (at most 1 hour ahead). The secret itself is never sent. Join tokens
    are not accepted here, and API tokens are not accepted for joining.

    Everything is scoped to the token's tenant. Another tenant's room answers
    `404`, exactly like a room that does not exist.

    **Errors** have the form `{"error": {"code": "...", "message": "..."}}`
    with codes `unauthorized` (401), `invalid` (400), `limit_reached` (403,
    plan limit), `not_found` (404), `conflict` (409), `internal` (500) and
    `unavailable` (503, retry).

    **Plans.** Each tenant can have limits: concurrent rooms, concurrent
    participants (all rooms together) and room size. They are counted across
    all nodes, from counts that are at most a few seconds old.

    **Many nodes.** Any node can be called: room calls are forwarded to the
    node that owns the room, new rooms go to the least loaded node, and the
    room list merges all nodes.

    **Admin API (`/admin/v1`).** For the platform operator only: tenants, API
    keys, limits, webhooks and usage for billing. It needs
    `Authorization: Bearer <admin secret>` (the server's `SFU_ADMIN_SECRET`)
    and exists only when that secret is set.

    **Webhooks.** See the `webhooks` section: signed room events sent to each
    tenant's `webhook_url`.

    **Joining** a room needs a join token (JWT, HS256); see the AsyncAPI
    document. Browsers may only open `/ws` from pages served by the same host.
  license:
    name: See repository
servers:
  - url: http://localhost:8080
    description: Local development server (default `-addr :8080`)
security: []
tags:
  - name: admin
    description: Operator admin API — tenants, keys, limits, usage
  - name: rooms
    description: Server API — rooms
  - name: participants
    description: Server API — participants in a room
  - name: tokens
    description: Server API — join tokens
  - name: signaling
    description: WebRTC signaling over WebSocket
  - name: operations
    description: Health and documentation
  - name: demo
    description: Browser demo client
paths:
  /admin/v1/tenants:
    post:
      tags: [admin]
      operationId: adminCreateTenant
      summary: Create a tenant (customer)
      description: Returns the tenant's first API key and secret, and its webhook secret. The secrets are shown only here.
      security: [{ adminSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { $ref: '#/components/schemas/id' }
                name: { type: string }
                auto_create_rooms: { type: boolean, default: false }
                webhook_url: { type: string, format: uri }
                limits: { $ref: '#/components/schemas/limits' }
            example: { id: acme, name: Acme Inc, webhook_url: "https://acme.example/sfu-hook", limits: { max_rooms: 50, max_participants: 500, max_room_size: 25 } }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant: { allOf: [{ $ref: '#/components/schemas/tenant' }, { type: object, properties: { webhook_secret: { type: string } } }] }
                  api_key: { type: string, example: key_3f9a1c0b2d4e6f8a1b2c }
                  api_secret: { type: string }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "403": { $ref: '#/components/responses/limitReached' }
        "409": { $ref: '#/components/responses/conflict' }
        "503": { $ref: '#/components/responses/unavailable' }
    get:
      tags: [admin]
      operationId: adminListTenants
      summary: List tenants
      security: [{ adminSecret: [] }]
      responses:
        "200":
          description: All tenants.
          content: { application/json: { schema: { type: object, properties: { tenants: { type: array, items: { $ref: '#/components/schemas/tenant' } } } } } }
        "401": { $ref: '#/components/responses/unauthorized' }
  /admin/v1/tenants/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/id' } }
    get:
      tags: [admin]
      operationId: adminGetTenant
      summary: Get a tenant
      security: [{ adminSecret: [] }]
      responses:
        "200": { description: The tenant., content: { application/json: { schema: { $ref: '#/components/schemas/tenant' } } } }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
    patch:
      tags: [admin]
      operationId: adminUpdateTenant
      summary: Update a tenant
      description: |
        Fields present are changed. `disabled: true` blocks the tenant (its
        tokens stop working on every node within 10 seconds). With
        `rotate_webhook_secret: true` the response contains the new secret.
      security: [{ adminSecret: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                auto_create_rooms: { type: boolean }
                webhook_url: { type: string }
                limits: { $ref: '#/components/schemas/limits' }
                disabled: { type: boolean }
                rotate_webhook_secret: { type: boolean }
      responses:
        "200": { description: The tenant after the change., content: { application/json: { schema: { $ref: '#/components/schemas/tenant' } } } }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
  /admin/v1/tenants/{id}/keys:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/id' } }
    post:
      tags: [admin]
      operationId: adminCreateKey
      summary: Create an API key (for rotation)
      security: [{ adminSecret: [] }]
      responses:
        "201":
          description: The new key. The secret is shown only here.
          content: { application/json: { schema: { type: object, properties: { api_key: { type: string }, api_secret: { type: string }, created_at: { type: string, format: date-time } } } } }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
    get:
      tags: [admin]
      operationId: adminListKeys
      summary: List a tenant's keys (without secrets)
      security: [{ adminSecret: [] }]
      responses:
        "200":
          description: Keys.
          content: { application/json: { schema: { type: object, properties: { keys: { type: array, items: { type: object, properties: { api_key: { type: string }, tenant_id: { type: string }, created_at: { type: string, format: date-time }, revoked: { type: boolean } } } } } } } }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
  /admin/v1/tenants/{id}/keys/{key}:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/id' } }
      - { name: key, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      operationId: adminRevokeKey
      summary: Revoke an API key
      description: Tokens signed with it stop working on every node within 10 seconds.
      security: [{ adminSecret: [] }]
      responses:
        "204": { description: Revoked. }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
  /admin/v1/tenants/{id}/usage:
    parameters:
      - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/id' } }
    get:
      tags: [admin]
      operationId: adminUsage
      summary: Usage for billing
      description: Participant-minutes per UTC day. Default range is the current month up to today. Time is written every minute while people are connected.
      security: [{ adminSecret: [] }]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date, example: "2026-10-01" } }
        - { name: to, in: query, schema: { type: string, format: date, example: "2026-10-31" } }
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_id: { type: string }
                  from: { type: string, format: date }
                  to: { type: string, format: date }
                  days: { type: array, items: { type: object, properties: { day: { type: string, format: date }, participant_minutes: { type: number } } } }
                  total_participant_minutes: { type: number }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
  /v1/rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: Create a room
      description: |
        Creates a room with options. It stays open while empty for
        `empty_timeout_seconds` (default 300), then it is removed. A join only
        works for a room created here, unless the tenant has
        `auto_create_rooms` enabled: then a join creates a missing room, with no
        limits, which is removed when the last person leaves.
      security: [{ apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { $ref: '#/components/schemas/id' }
                max_participants: { type: integer, minimum: 0, maximum: 1000, default: 0, description: '0 means no limit.' }
                empty_timeout_seconds: { type: integer, minimum: 1, maximum: 86400, default: 300 }
            example: { name: standup, max_participants: 10, empty_timeout_seconds: 600 }
      responses:
        "201": { description: Created., content: { application/json: { schema: { $ref: '#/components/schemas/room' } } } }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "409": { $ref: '#/components/responses/conflict' }
    get:
      tags: [rooms]
      operationId: listRooms
      summary: List rooms
      security: [{ apiToken: [] }]
      responses:
        "200":
          description: The tenant's rooms, sorted by name.
          content:
            application/json:
              schema:
                type: object
                required: [rooms]
                properties:
                  rooms: { type: array, items: { $ref: '#/components/schemas/room' } }
        "401": { $ref: '#/components/responses/unauthorized' }
  /v1/rooms/{room}:
    parameters:
      - $ref: '#/components/parameters/room'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: Get a room with its participants
      security: [{ apiToken: [] }]
      responses:
        "200":
          description: The room.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/room'
                  - type: object
                    properties:
                      participants: { type: array, items: { $ref: '#/components/schemas/participant' } }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
    delete:
      tags: [rooms]
      operationId: deleteRoom
      summary: Close a room
      description: Every participant receives `removed` ("room closed") and is disconnected. The room is removed at once.
      security: [{ apiToken: [] }]
      responses:
        "204": { description: Closed. }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
  /v1/rooms/{room}/participants:
    parameters:
      - $ref: '#/components/parameters/room'
    get:
      tags: [participants]
      operationId: listParticipants
      summary: List participants
      security: [{ apiToken: [] }]
      responses:
        "200":
          description: Participants, sorted by identity.
          content:
            application/json:
              schema:
                type: object
                required: [participants]
                properties:
                  participants: { type: array, items: { $ref: '#/components/schemas/participant' } }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
  /v1/rooms/{room}/participants/{identity}:
    parameters:
      - $ref: '#/components/parameters/room'
      - name: identity
        in: path
        required: true
        schema: { $ref: '#/components/schemas/id' }
    patch:
      tags: [participants]
      operationId: updateParticipant
      summary: Change a participant's permissions live
      description: |
        Fields that are present replace the current value; missing fields keep
        it. Sources it may no longer publish stop being forwarded (and resume
        if allowed again, without renegotiation). Without `subscribe`, it stops
        receiving media. The participant receives a `permissions` message. The
        new permissions stay with the identity while the room exists and
        replace the token's grants if it reconnects.
      security: [{ apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                grants: { $ref: '#/components/schemas/grants' }
            example: { grants: { sources: [camera, microphone] } }
      responses:
        "200": { description: The participant after the change., content: { application/json: { schema: { $ref: '#/components/schemas/participant' } } } }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
    delete:
      tags: [participants]
      operationId: removeParticipant
      summary: Remove a participant
      description: The participant receives `removed` ("removed by the server") and is disconnected. Its tracks stop for everyone. It can join again with a valid token.
      security: [{ apiToken: [] }]
      responses:
        "204": { description: Removed. }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
  /v1/rooms/{room}/participants/{identity}/mute:
    parameters:
      - $ref: '#/components/parameters/room'
      - name: identity
        in: path
        required: true
        schema: { $ref: '#/components/schemas/id' }
    post:
      tags: [participants]
      operationId: muteParticipant
      summary: Mute or unmute a participant's source from the server
      description: |
        The source stops (or resumes) being forwarded to everyone. All
        participants, including this one, receive `mute` with `by_server: true`.
        The participant cannot unmute a server mute itself, and reconnecting
        does not undo it: it stays with the identity while the room exists.
      security: [{ apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source, muted]
              additionalProperties: false
              properties:
                source: { type: string, enum: [camera, microphone, screen, screen-audio] }
                muted: { type: boolean }
            example: { source: microphone, muted: true }
      responses:
        "204": { description: Done. }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
        "404": { $ref: '#/components/responses/notFound' }
  /v1/tokens:
    post:
      tags: [tokens]
      operationId: createToken
      summary: Create a join token
      description: |
        Signs a join token for the tenant, for backends that do not sign tokens
        themselves. Grants default to publish and subscribe, all sources.
      security: [{ apiToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [room, identity]
              additionalProperties: false
              properties:
                room: { $ref: '#/components/schemas/id' }
                identity: { $ref: '#/components/schemas/id' }
                ttl_seconds: { type: integer, minimum: 1, maximum: 86400, default: 3600 }
                grants: { $ref: '#/components/schemas/grants' }
            example: { room: standup, identity: alice, ttl_seconds: 3600, grants: { publish: true, subscribe: true, sources: [camera, microphone] } }
      responses:
        "201":
          description: The join token.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        "400": { $ref: '#/components/responses/invalid' }
        "401": { $ref: '#/components/responses/unauthorized' }
  /ws:
    get:
      tags: [signaling]
      operationId: openSignaling
      summary: Open the WebSocket signaling connection
      description: |
        Upgrades the request to a WebSocket. Send a `join` message first, then
        follow the protocol in `/api/asyncapi.yaml`. Messages are JSON text
        frames of at most 64 KB. The server pings every 30 seconds and closes
        the connection after 60 seconds without a pong.
      parameters:
        - name: Upgrade
          in: header
          required: true
          schema: { type: string, enum: [websocket] }
        - name: Connection
          in: header
          required: true
          schema: { type: string, example: Upgrade }
        - name: Sec-WebSocket-Version
          in: header
          required: true
          schema: { type: string, enum: ["13"] }
        - name: Sec-WebSocket-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Switching protocols; the WebSocket is open.
        "400":
          description: Not a valid WebSocket upgrade request.
        "403":
          description: Cross-origin browser request rejected.
  /dev/token:
    get:
      tags: [demo]
      operationId: devToken
      summary: Development join token (only with -dev)
      description: |
        Returns a one-hour join token with all permissions for the development
        tenant. Exists only when the server runs with `-dev` (404 otherwise).
        Never enable in production: it gives tokens to anyone.
      parameters:
        - { name: room, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
        - { name: participant, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
      responses:
        "200":
          description: A join token.
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "400":
          description: Invalid room or participant.
        "404":
          description: The server is not in development mode.
  /healthz:
    get:
      tags: [operations]
      operationId: health
      summary: Health check
      responses:
        "200":
          description: The server is running.
          content:
            text/plain:
              schema: { type: string, const: ok }
  /:
    get:
      tags: [demo]
      operationId: demoPage
      summary: Browser demo page
      description: A page to join a room with camera, microphone and screen share.
      responses:
        "200":
          description: The demo page.
          content:
            text/html:
              schema: { type: string }
  /docs:
    get:
      tags: [operations]
      operationId: httpDocs
      summary: This document, rendered with Swagger UI
      responses:
        "200":
          description: HTML page. Loads Swagger UI from a public CDN.
          content:
            text/html:
              schema: { type: string }
  /docs/signaling:
    get:
      tags: [operations]
      operationId: signalingDocs
      summary: The signaling protocol, rendered with the AsyncAPI viewer
      responses:
        "200":
          description: HTML page. Loads the AsyncAPI viewer from a public CDN.
          content:
            text/html:
              schema: { type: string }
  /api/openapi.yaml:
    get:
      tags: [operations]
      operationId: openapiSpec
      summary: This OpenAPI document
      responses:
        "200":
          description: OpenAPI 3.1 document.
          content:
            application/yaml:
              schema: { type: string }
  /api/asyncapi.yaml:
    get:
      tags: [operations]
      operationId: asyncapiSpec
      summary: The AsyncAPI document for WebSocket signaling
      responses:
        "200":
          description: AsyncAPI 3.0 document.
          content:
            application/yaml:
              schema: { type: string }
webhooks:
  roomEvent:
    post:
      summary: Room event sent to the tenant's webhook_url
      description: |
        Events: `room_started`, `room_finished`, `participant_joined`,
        `participant_left`, `track_published`, `track_unpublished`.

        Headers: `X-SFU-Event: <event>` and
        `X-SFU-Signature: t=<unix seconds>,v1=<hex HMAC-SHA256(webhook_secret, "<t>.<raw body>")>`.
        Verify the signature over the raw body and reject old timestamps
        (for example older than 5 minutes). Answer 2xx; other answers are
        retried up to 3 times (except 4xx other than 408 and 429). Events of
        one room can arrive out of order: use `created_at`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [id, event, created_at, room]
              properties:
                id: { type: string, example: evt_9f2c1a0b3d4e5f6a7b8c9d0e }
                event: { type: string, enum: [room_started, room_finished, participant_joined, participant_left, track_published, track_unpublished] }
                created_at: { type: string, format: date-time }
                room: { type: object, properties: { name: { type: string } } }
                participant: { type: object, properties: { identity: { type: string }, duration_seconds: { type: integer, description: 'participant_left only' } } }
                track: { type: object, properties: { source: { type: string, enum: [camera, microphone, screen, screen-audio] } } }
            example: { id: evt_9f2c1a0b3d4e5f6a7b8c9d0e, event: participant_left, created_at: "2026-10-10T09:30:00Z", room: { name: standup }, participant: { identity: alice, duration_seconds: 1820 } }
      responses:
        "200": { description: Received. }
components:
  securitySchemes:
    adminSecret:
      type: http
      scheme: bearer
      description: The operator admin secret (SFU_ADMIN_SECRET).
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'API token: HS256 JWT signed with the tenant secret, claims iss (API key), aud "sfu-api", iat, exp (at most 1 hour ahead).'
  parameters:
    room:
      name: room
      in: path
      required: true
      schema: { $ref: '#/components/schemas/id' }
  schemas:
    id:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,64}$'
    room:
      type: object
      required: [name, created_at, num_participants, max_participants, empty_timeout_seconds]
      properties:
        name: { $ref: '#/components/schemas/id' }
        created_at: { type: string, format: date-time }
        num_participants: { type: integer }
        max_participants: { type: integer, description: '0 means no limit.' }
        empty_timeout_seconds: { type: integer, description: '0 for rooms created by a join (removed when empty).' }
    participant:
      type: object
      required: [identity, joined_at, sources, muted, grants]
      properties:
        identity: { $ref: '#/components/schemas/id' }
        joined_at: { type: string, format: date-time }
        sources:
          type: array
          description: Sources being published.
          items: { type: string, enum: [camera, microphone, screen, screen-audio] }
        muted:
          type: object
          additionalProperties: { type: boolean }
          example: { microphone: true }
        grants: { $ref: '#/components/schemas/grants' }
    limits:
      type: object
      description: Zero means no limit.
      properties:
        max_rooms: { type: integer, minimum: 0, description: Concurrent rooms. }
        max_participants: { type: integer, minimum: 0, description: Concurrent participants in all rooms together. }
        max_room_size: { type: integer, minimum: 0, description: Participants in one room. }
    tenant:
      type: object
      properties:
        id: { $ref: '#/components/schemas/id' }
        name: { type: string }
        auto_create_rooms: { type: boolean }
        webhook_url: { type: string }
        limits: { $ref: '#/components/schemas/limits' }
        disabled: { type: boolean }
        created_at: { type: string, format: date-time }
    grants:
      type: object
      additionalProperties: false
      properties:
        publish: { type: boolean, default: true }
        subscribe: { type: boolean, default: true }
        sources:
          type: array
          description: Allowed sources to publish. Empty or missing means all.
          items: { type: string, enum: [camera, microphone, screen, screen-audio] }
    error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, enum: [unauthorized, invalid, limit_reached, not_found, conflict, internal, unavailable] }
            message: { type: string }
  responses:
    unauthorized:
      description: Missing or invalid API token.
      content: { application/json: { schema: { $ref: '#/components/schemas/error' } } }
    invalid:
      description: Invalid request.
      content: { application/json: { schema: { $ref: '#/components/schemas/error' } } }
    notFound:
      description: No such room or participant for this tenant.
      content: { application/json: { schema: { $ref: '#/components/schemas/error' } } }
    limitReached:
      description: A plan limit was reached.
      content: { application/json: { schema: { $ref: '#/components/schemas/error' } } }
    unavailable:
      description: The cluster is temporarily unavailable; retry.
      content: { application/json: { schema: { $ref: '#/components/schemas/error' } } }
    conflict:
      description: The room already exists.
      content: { application/json: { schema: { $ref: '#/components/schemas/error' } } }
